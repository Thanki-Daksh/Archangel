# Archangel — Where information is collected
# Each source must have an id, type, and enabled flag.
# Collectors read this file to know which channels to monitor.

sources:
  - id: reddit_hiring
    type: reddit
    subreddits: ["hiring", "forhire", "freelance_forhire", "jobbit"]
    query: "[Hiring] developer"
    max_results: 15
    enabled: true

  - id: reddit_python_jobs
    type: reddit
    subreddits: ["pythonforhire", "Python", "automation"]
    query: "hiring python"
    max_results: 15
    enabled: true

  - id: reddit_webdev
    type: reddit
    subreddits: ["webdev", "django", "flask"]
    query: "hiring web developer"
    max_results: 15
    enabled: true

  - id: x_hiring_dev
    type: x
    query: "hiring python developer"
    max_results: 10
    enabled: true

  - id: x_hiring_automation
    type: x
    query: "looking to hire developer"
    max_results: 10
    enabled: true
